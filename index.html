<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>لوحة EPPTS التنفيذية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: right-hand navigation rail + one focused view at a time. Overview leads with "needs a decision", then the registries, onboarding pipeline, pricing and stock. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#112027; --muted:#566873; --line:#DCE3E8;
  --accent:#0A6B68; --accent-ink:#FFFFFF; --soft:#E4F1F0;
  --c1:#0A6B68; --c2:#3552A3; --c3:#8B4F9F;
  --good:#1B8A57; --warn:#B06F10; --bad:#C23B2E;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151A; --surface:#142026; --ink:#E7EEF2; --muted:#93A5B1; --line:#25363F;
  --accent:#4FC3B8; --accent-ink:#05201E; --soft:#17302F;
  --c1:#4FC3B8; --c2:#7E97E0; --c3:#C58BD8;
  --good:#4CC38A; --warn:#E0A84A; --bad:#F0786B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151A; --surface:#142026; --ink:#E7EEF2; --muted:#93A5B1; --line:#25363F;
  --accent:#4FC3B8; --accent-ink:#05201E; --soft:#17302F;
  --c1:#4FC3B8; --c2:#7E97E0; --c3:#C58BD8;
  --good:#4CC38A; --warn:#E0A84A; --bad:#F0786B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;max-width:1480px;margin:0 auto}
nav{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 12px 20px max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto}
.brand{padding:4px 8px 18px}
.brand b{display:block;font-family:var(--f-head);font-size:20px;letter-spacing:.5px}
.brand span{font-size:12.5px;color:var(--muted)}
nav a{display:block;padding:9px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:700}
.navnote{margin:18px 8px 0;font-size:12px;color:var(--muted);line-height:1.6}
.main{padding:18px max(16px,env(safe-area-inset-left,0px)) 0 24px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-family:var(--f-head);font-size:22px;margin:0;font-weight:700}
.top .sub{font-size:12.5px;color:var(--muted)}
.logos{display:flex;gap:14px;align-items:center}
.lgimg{height:54px;width:auto;max-width:160px;display:block}
.note{margin:0 0 16px;padding:9px 12px;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:6px;font-size:13px;background:var(--surface)}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--soft);color:var(--accent);border-radius:14px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.badge button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:20px;height:20px;line-height:1;font-size:12px;padding:0}
h2{font-family:var(--f-head);font-size:16px;margin:0 0 3px;font-weight:700}
.q{font-size:13px;color:var(--muted);margin:0 0 10px}
section{margin-top:24px}
section:first-child{margin-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.scroll{overflow-x:auto}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.grid>*{min-width:0}
.dc{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.dc:hover{border-color:var(--accent)}
.dc .v{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.dc .l{font-size:13.5px;margin-top:2px}
.dc .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dc .go{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:8px;display:block}
.dc.r .v{color:var(--bad)} .dc.w .v{color:var(--warn)}
.grp{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grp:hover{border-color:var(--accent)}
.grp .gl{font-size:13.5px;color:var(--muted);font-weight:600}
.grp .gv{font-family:var(--f-head);font-size:32px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.split{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0}
.split b{display:block;height:100%}
.k1{background:var(--c1)} .k2{background:var(--c2)} .k3{background:var(--c3)}
.sd{background:var(--good)} .sv{background:var(--warn)} .sn{background:var(--muted)} .sb{background:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px}
.lg span{display:inline-flex;gap:5px;align-items:center}
.lg i,.tp i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg i.sd{background:var(--good)} .lg i.sv{background:var(--warn)} .lg i.sn{background:var(--muted)}
.tp{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-fac i,.t-dis i{background:var(--c1)} .t-imp i,.t-tpl i{background:var(--c2)} .t-sci i,.t-wh i{background:var(--c3)}
.bigrow{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 12px}
.bigrow div{font-size:13px;color:var(--muted)}
.bigrow b{display:block;font-family:var(--f-head);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.rank{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:8px 12px;align-items:center;font-size:13.5px}
.rank .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.rank .bar b{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.w{white-space:normal;min-width:170px}
tr:last-child td{border-bottom:0}
.num{text-align:left} th.num{text-align:left}
tr.row{cursor:pointer} tr.row:hover td{background:var(--soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.det td{background:color-mix(in srgb,var(--accent) 5%,transparent);white-space:normal}
.s2{display:block;font-size:12px;color:var(--muted);font-weight:400}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.chip.paid{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.n{background:var(--line);color:var(--muted)}
.good-t{color:var(--good);font-weight:600} .bad-t{color:var(--bad);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.f{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 13px;font-size:13px}
.f[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.mini{display:flex;height:8px;min-width:120px;border-radius:4px;overflow:hidden;background:var(--line)}
.mini b{display:block;height:100%}
.arrow{display:inline-block;color:var(--muted);transition:transform .15s} .open .arrow{transform:rotate(-90deg)}
.loc{display:grid;grid-template-columns:minmax(150px,240px) 1fr 90px 190px;gap:6px 12px;align-items:center;font-size:13px;padding:3px 0}
.loc .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.loc .bar b{display:block;height:100%;background:var(--accent)}
.hist{margin-top:8px;font-size:12.5px;color:var(--muted)}
.more{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 14px;font-size:13px}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.tile .l{font-size:13px;color:var(--muted)} .tile .v{font-family:var(--f-head);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .n{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));border-inline-end:0;border-bottom:1px solid var(--line);z-index:20}
  .brand,.navnote{display:none}
  nav a{white-space:nowrap;margin:0}
  #links{display:flex;gap:4px}
  .main{padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
  .loc{grid-template-columns:1fr 80px}
  .loc .bar,.loc .sx{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  var dp=D.disp,tot=dp.pharm+dp.hosp+dp.adm;
  var rows=D.sitelocs;
  var h='<section><h2>الصيدليات والمستشفيات</h2><p class="q">المسجلة في سجل الأطراف. التصنيف بين صيدلية ومستشفى وجهة صحية مأخوذ من الاسم، والسجل لا يحمل المحافظة لهذه الجهات. تم استبعاد '+dp.test+' سجل تجريبي.</p>'+
   '<div class="tiles"><div class="tile"><div class="l">صيدليات</div><div class="v">'+fmt(dp.pharm)+'</div><div class="n">'+pct(dp.pharm,tot)+'%</div></div>'+
   '<div class="tile"><div class="l">مستشفيات ووحدات بالمستشفيات</div><div class="v">'+fmt(dp.hosp)+'</div><div class="n">'+pct(dp.hosp,tot)+'%</div></div>'+
   '<div class="tile"><div class="l">إدارات صحية وقوافل ووحدات</div><div class="v">'+fmt(dp.adm)+'</div><div class="n">'+pct(dp.adm,tot)+'%</div></div>'+
   '<div class="tile"><div class="l">إجمالي نقاط الصرف</div><div class="v">'+fmt(tot)+'</div></div></div></section>';
  h+='<section><h2>مواقع الصرف والتخزين اللي عليها حركة</h2><p class="q">من ملف المخزون والشحنات: المواقع التابعة للموزعين وكم علبة عندها وكم استلمت من الصيدليات والمستشفيات.</p>'+
   '<div class="panel scroll"><table><tr><th>الموقع</th><th>النوع</th><th>تابع لـ</th><th class="num">علب في المخزون</th><th class="num">استلمت من صيدليات</th><th class="num">استلمت من موزعين</th></tr>'+
   rows.map(function(l){return '<tr><td class="w"><b>'+esc(l.n)+'</b></td><td>'+KIND[l.k]+'</td><td>'+esc(l.o)+'</td><td class="num">'+fmt(l.q)+'</td><td class="num">'+fmt(l.p)+'</td><td class="num">'+fmt(l.d)+'</td></tr>'}).join('')+'</table></div></section>';
  return h;
};

function productRows(){
  var P=PR.filter(function(p){
    if(S.sel&&p.rg!==S.sel)return false;
    if(S.q&&(p.n+p.mah+p.mfr+p.rn+p.gt).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
    if(S.pf==='pending')return p.rv==='pending';
    if(S.pf==='stock')return p.q>0;
    if(S.pf==='nomove')return !p.mv;
    return true}).sort(function(a,b){return (b.mv-a.mv)||(b.q-a.q)||a.n.localeCompare(b.n)});
  if(!P.length)return '<tr><td class="empty">مفيش منتجات مطابقة</td></tr>';
  var h='<tr><th></th><th>المنتج</th><th>الشركة المسجِّلة</th><th>صاحب المنتج</th><th>العبوة</th><th class="num">سعر العلبة (ج)</th><th>التسعير</th><th class="num">في المخزون</th><th class="num">شُحنت لموزعين</th><th class="num">شُحنت لصيدليات</th></tr>';
  P.slice(0,S.more).forEach(function(p){
    var o=S.open[p.gt];
    h+='<tr class="row'+(o?' open':'')+'" data-p="'+p.gt+'"><td><span class="arrow">◂</span></td><td class="w"><b>'+esc(p.n)+'</b><span class="s2">GTIN '+p.gt+'</span></td><td class="w">'+(esc(p.rn)||'-')+'</td><td class="w">'+esc(p.mah)+'<span class="s2">'+esc(p.mfr)+'</span></td><td>'+(esc(p.pk)||'-')+'<span class="s2">'+esc(p.df)+'</span></td><td class="num">'+p.pr.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td><td>'+(p.rv==='approved'?'<span class="chip paid">معتمد</span>':'<span class="chip warn">بانتظار الاعتماد</span>')+'</td><td class="num">'+(p.mv?'<b>'+fmt(p.q)+'</b>':'-')+'</td><td class="num">'+(p.d?fmt(p.d):'-')+'</td><td class="num">'+(p.p?fmt(p.p):'-')+'</td></tr>';
    if(o){
      var mx=Math.max.apply(null,p.st.map(function(l){return Math.max(l.q,l.d,l.p)}).concat([1]));
      h+='<tr class="det"><td></td><td colspan="9">'+(p.st.length?p.st.map(function(l){return '<div class="loc"><span><b>'+esc(l.n)+'</b> <span style="color:var(--muted);font-size:12px">'+KIND[l.k]+(l.o?' · '+esc(l.o):'')+'</span></span><span class="bar"><b style="width:'+Math.round(Math.max(l.q,l.p,l.d)/mx*100)+'%"></b></span><b>'+fmt(l.q)+' علبة</b><span class="sx" style="color:var(--muted)">شُحن لموزعين '+fmt(l.d)+' · لصيدليات '+fmt(l.p)+'</span></div>'}).join(''):'<span style="color:var(--muted)">مفيش حركة مخزون أو شحن مسجلة للمنتج ده.</span>')+
       (p.h.length?'<div class="hist">سجل السعر: '+p.h.map(function(x){return x.at+' '+(x.ty==='created'?'تسجيل بسعر '+x.nv:'من '+x.pv+' إلى '+x.nv)}).join(' · ')+'</div>':'')+'</td></tr>';
    }
  });
  var left=P.length-S.more;
  if(left>0)h+='<tr><td colspan="10" style="text-align:center"><button class="more" data-more>عرض المزيد ('+left+')</button></td></tr>';
  return h;
}
VIEWS.products=function(){
  var cos=CO.filter(function(c){return c.np>0});
  var cnt={all:PR.length,pending:PR.filter(function(p){return p.rv==='pending'}).length,stock:PR.filter(function(p){return p.q>0}).length,nomove:PR.filter(function(p){return !p.mv}).length};
  return '<section><h2>المنتجات والمخزون</h2><p class="q">صاحب كل منتج وسعر العلبة وعدد العلب وأماكنها. اضغط على المنتج لعرض المواقع وسجل السعر.</p><div class="tools">'+
   '<select data-sel aria-label="الشركة"><option value="">كل الشركات</option>'+cos.map(function(c){return '<option value="'+esc(c.g)+'"'+(S.sel===c.g?' selected':'')+'>'+esc(c.n)+'</option>'}).join('')+'</select>'+
   '<input type="search" id="pq" placeholder="ابحث باسم المنتج أو الشركة أو GTIN" aria-label="بحث" value="'+esc(S.q)+'" style="flex:1;max-width:320px">'+
   [['all','الكل'],['pending','بانتظار التسعير'],['stock','عليها مخزون'],['nomove','بدون حركة']].map(function(x){return '<button class="f" data-pf="'+x[0]+'" aria-pressed="'+(S.pf===x[0])+'">'+x[1]+' ('+cnt[x[0]]+')</button>'}).join('')+
   '</div><div class="panel scroll"><table id="ptable">'+productRows()+'</table></div></section>';
};

VIEWS.invoices=function(){
  return '<section><h2>الفواتير والمدفوعات</h2><p class="q">كام فاتورة طلعت، وكام لكل شركة، والمبلغ، والمدفوع وغير المدفوع.</p><div class="panel empty"><b>ملف الفواتير لم يصل بعد</b>'+
   'الملفات المرفوعة فيها الشركات والمنتجات والمخزون والشحنات، بدون فواتير ولا مدفوعات.<br>ابعت ملف فيه: رقم الفاتورة، الشركة (GLN)، المشتري (GLN)، التاريخ، تاريخ الاستحقاق، المنتجات وعدد العلب، المبلغ، ومدفوعة (نعم/لا).</div></section>';
};

function route(){var r=(location.hash||'#overview').slice(1);return VIEWS[r]?r:'overview'}
function render(){
  var r=route();
  $('links').innerHTML=ROUTES.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===r?' aria-current="page"':'')+'>'+x[1]+'</a>'}).join('');
  $('title').textContent=ROUTES.filter(function(x){return x[0]===r})[0][1];
  var cn=S.sel?CO.filter(function(c){return c.g===S.sel})[0]:null;
  $('badge').innerHTML=(cn&&r==='products')?'<span class="badge">'+esc(cn.n)+' <button data-clear aria-label="إلغاء التصفية">✕</button></span>':'';
  $('view').innerHTML=VIEWS[r]();
}
function go(r){if(location.hash==='#'+r)render();else location.hash=r}
window.addEventListener('hashchange',function(){S.more=25;render();window.scrollTo(0,0)});
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(t.closest('[data-clear]')){S.sel='';render();return}
  if(b=t.closest('[data-go]')){
    if(b.hasAttribute('data-pf')){S.pf=b.getAttribute('data-pf');S.sel='';S.q=''}
    if(b.hasAttribute('data-cst')){S.cst=b.getAttribute('data-cst');S.ctf='all'}else if(b.getAttribute('data-go')==='companies'){S.cst='all';S.ctf='all'}
    go(b.getAttribute('data-go'));return}
  if(b=t.closest('tr[data-c]')){S.sel=b.getAttribute('data-c');S.pf='all';S.q='';S.more=25;go('products');return}
  if(b=t.closest('tr[data-p]')){var id=b.getAttribute('data-p');S.open[id]=!S.open[id];$('ptable').innerHTML=productRows();return}
  if(b=t.closest('[data-ctf]')){S.ctf=b.getAttribute('data-ctf');render();return}
  if(b=t.closest('button[data-cst]')){S.cst=b.getAttribute('data-cst');render();return}
  if(b=t.closest('button[data-pf]')){S.pf=b.getAttribute('data-pf');S.more=25;render();return}
  if(t.closest('[data-more]')){S.more+=25;$('ptable').innerHTML=productRows();return}
});
document.addEventListener('change',function(e){if(e.target.hasAttribute('data-sel')){S.sel=e.target.value;S.more=25;render()}});
document.addEventListener('input',function(e){if(e.target.id==='pq'){S.q=e.target.value.trim();S.more=25;$('ptable').innerHTML=productRows()}});
$('asof').textContent='التتبع على مستوى العلبة · الأسعار بالجنيه المصري';
$('nd').textContent=D.asof;
render();
</script>

</body></html>
