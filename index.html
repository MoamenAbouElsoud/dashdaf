<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body><title>لوحة EPTTS التنفيذية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
<style>
/* Layout: right-hand navigation rail + one focused view at a time. Overview leads with "needs a decision", then the registries, onboarding pipeline, pricing and stock. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0F1A33; --muted:#586379; --line:#DDE2EC;
  --accent:#17307F; --accent-ink:#FFFFFF; --soft:#E8ECF7;
  --navy:#0E2266; --navy-ink:#FFFFFF; --gold:#B8912C;
  --c1:#17307F; --c2:#B8912C; --c3:#6F7FA3;
  --good:#1B8A57; --warn:#B06F10; --bad:#C23B2E;
  --shadow:0 1px 2px rgba(15,26,51,.06),0 4px 14px rgba(15,26,51,.05);
  --f-body:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  --f-head:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1022; --surface:#111A33; --ink:#E8ECF6; --muted:#9AA6C0; --line:#22304F;
  --accent:#8FA8F2; --accent-ink:#0A1230; --soft:#18264A;
  --navy:#0C1536; --navy-ink:#FFFFFF; --gold:#D8B24E;
  --c1:#8FA8F2; --c2:#D8B24E; --c3:#8190B3;
  --good:#4CC38A; --warn:#E0A84A; --bad:#F0786B; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1022; --surface:#111A33; --ink:#E8ECF6; --muted:#9AA6C0; --line:#22304F;
  --accent:#8FA8F2; --accent-ink:#0A1230; --soft:#18264A;
  --navy:#0C1536; --navy-ink:#FFFFFF; --gold:#D8B24E;
  --c1:#8FA8F2; --c2:#D8B24E; --c3:#8190B3;
  --good:#4CC38A; --warn:#E0A84A; --bad:#F0786B; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body[data-r=report] .top .logos{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;max-width:1480px;margin:0 auto}
nav{background:var(--navy);color:var(--navy-ink);padding:20px 12px 20px max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto}
.brand{padding:4px 8px 18px}
.brand b{display:block;font-family:var(--f-head);font-size:21px;letter-spacing:1px;color:var(--navy-ink)}
.brand b::after{content:"";display:block;width:28px;height:3px;background:var(--gold);margin-top:6px;border-radius:2px}
.brand span{display:block;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.7)}
nav a{display:block;padding:9px 12px;border-radius:6px;color:rgba(255,255,255,.82);text-decoration:none;font-size:14.5px;font-weight:500;margin-bottom:2px;border-inline-start:3px solid transparent;transition:background .18s,color .18s}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a[aria-current=page]{background:rgba(255,255,255,.13);color:#fff;font-weight:700;border-inline-start-color:var(--gold)}
nav :focus-visible{outline-color:var(--gold)}
.navnote{margin:18px 8px 0;font-size:12px;color:rgba(255,255,255,.6);line-height:1.6}
.main{padding:18px max(16px,env(safe-area-inset-left,0px)) 0 24px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:12px 18px;box-shadow:var(--shadow)}
.top h1{font-family:var(--f-head);font-size:22px;margin:0;font-weight:700;color:var(--accent)}
.top .sub{font-size:12.5px;color:var(--muted)}
.logos{display:flex;gap:14px;align-items:center}
.logos{background:#fff;border-radius:6px;padding:4px 10px}
.lgimg{height:50px;width:auto;max-width:160px;display:block}
.note{margin:0 0 16px;padding:9px 12px;border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:6px;font-size:13px;background:var(--surface)}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--soft);color:var(--accent);border-radius:14px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.badge button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:20px;height:20px;line-height:1;font-size:12px;padding:0}
h2{font-family:var(--f-head);font-size:16px;margin:0 0 3px;font-weight:700;color:var(--accent)}
h2::before{content:"";display:inline-block;width:4px;height:15px;background:var(--gold);border-radius:2px;margin-inline-end:8px;vertical-align:-2px}
.q{font-size:13px;color:var(--muted);margin:0 0 10px}
section{margin-top:24px}
section:first-child{margin-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g6{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
.dc{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;box-shadow:var(--shadow);transition:border-color .18s,transform .18s}
.dc:hover{border-color:var(--accent);transform:translateY(-2px)}
.dc .v{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.dc .l{font-size:13.5px;margin-top:2px}
.dc .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dc .go{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:8px;display:block}
.dc.r .v{color:var(--bad)} .dc.w .v{color:var(--warn)}
.grp{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .18s,transform .18s}
.grp:hover{border-color:var(--accent);transform:translateY(-2px)}
.grp .gl{font-size:13.5px;color:var(--muted);font-weight:600}
.grp .gv{font-family:var(--f-head);font-size:32px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--accent)}
.split{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0}
.split b{display:block;height:100%}
.k1{background:var(--c1)} .k2{background:var(--c2)} .k3{background:var(--c3)}
.sd{background:var(--good)} .sv{background:var(--warn)} .sn{background:var(--muted)} .sb{background:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px}
.lg span{display:inline-flex;gap:5px;align-items:center}
.lg i,.tp i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg i.sd{background:var(--good)} .lg i.sv{background:var(--warn)} .lg i.sn{background:var(--muted)}
.tp{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-fac i,.t-dis i{background:var(--c1)} .t-imp i,.t-tpl i{background:var(--c2)} .t-sci i,.t-wh i{background:var(--c3)}
.bigrow{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 12px}
.bigrow div{font-size:13px;color:var(--muted)}
.bigrow b{display:block;font-family:var(--f-head);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.rank{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:8px 12px;align-items:center;font-size:13.5px}
.rank .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.rank .bar b{display:block;height:100%;background:var(--c1)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.w{white-space:normal;min-width:170px}
tr:last-child td{border-bottom:0}
.num{text-align:left} th.num{text-align:left}
tr.row{cursor:pointer} td{transition:background .15s} tr.row:hover td{background:var(--soft)}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.det td{background:color-mix(in srgb,var(--accent) 5%,transparent);white-space:normal}
.s2{display:block;font-size:12px;color:var(--muted);font-weight:400}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.chip.paid{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.n{background:var(--line);color:var(--muted)}
.good-t{color:var(--good);font-weight:600} .bad-t{color:var(--bad);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.f{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 13px;font-size:13px;transition:background .15s,border-color .15s}
.f:hover{border-color:var(--accent)}
.f[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.mini{display:flex;height:8px;min-width:120px;border-radius:4px;overflow:hidden;background:var(--line)}
.mini b{display:block;height:100%}
.arrow{display:inline-block;color:var(--muted);transition:transform .15s} .open .arrow{transform:rotate(-90deg)}
.loc{display:grid;grid-template-columns:minmax(150px,240px) 1fr 90px 190px;gap:6px 12px;align-items:center;font-size:13px;padding:3px 0}
.loc .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.loc .bar b{display:block;height:100%;background:var(--c1)}
.hist{margin-top:8px;font-size:12.5px;color:var(--muted)}
.more{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 14px;font-size:13px}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--muted)} .tile .v{font-family:var(--f-head);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .n{font-size:12px;color:var(--muted)}
/* التقرير الموجز */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.rephead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:3px solid var(--gold)}
.rephead h3{font-family:var(--f-head);font-size:19px;margin:0;color:var(--accent)}
.rephead .sub{font-size:12.5px;color:var(--muted)}
.repbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px 24px;padding:18px 20px}
.repbody>div{min-width:0}
.rep h4{font-family:var(--f-head);font-size:14px;margin:0 0 6px;color:var(--accent)}
.rep table{font-size:13.5px}
.rep th{position:static;background:var(--navy);color:var(--navy-ink);border:0;padding:7px 10px}
.rep td{padding:7px 10px}
.rep tr:nth-child(even) td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.rep tr.tot td{background:var(--soft)}
.locked #login{display:flex}
#login{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--navy,#0F2260),#1a2f7a);align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
#lf{background:var(--surface);border-radius:14px;padding:28px 26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid #B8891F}
#lf h1{margin:0;text-align:center;font-size:26px;letter-spacing:2px;color:var(--ink)}
#lf p{margin:0 0 6px;text-align:center;color:var(--muted);font-size:13px}
#lf label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
#lf input{padding:10px 12px;font-size:15px}
#llogos{display:flex;justify-content:center;align-items:center;gap:10px}
#llogos .logos{display:flex;gap:10px;align-items:center}
#lerr{min-height:18px;color:#B3261E;font-size:13px;text-align:center}
body.locked>:not(#login){visibility:hidden}
.gsw{position:relative;flex:1 1 260px;max-width:380px;min-width:200px}
.gsw input{width:100%}
.gsr{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,26,51,.18);max-height:60vh;overflow:auto;z-index:25}
.gsh{padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
.gsi{display:block;width:100%;text-align:right;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.gsi:hover,.gsi:focus-visible{background:var(--soft)}
.gsi span{display:block;font-size:12px;color:var(--muted)}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:10px;padding:26px 16px;background:var(--surface);cursor:pointer;text-align:center}
.drop:hover{background:var(--soft)}
.drop span{font-size:13px;color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.copybtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 16px;font-size:13.5px;font-weight:600}
.copybtn:hover{opacity:.9}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));border-inline-end:0;border-bottom:1px solid var(--line);z-index:20}
  .brand,.navnote{display:none}
  nav a{white-space:nowrap;margin:0}
  #links{display:flex;gap:4px}
  .main{padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
  .loc{grid-template-columns:1fr 80px}
  .loc .bar,.loc .sx{grid-column:1/-1}
}
/* حركة هادئة: تظهر مرة واحدة عند فتح الصفحة فقط، والقيم نفسها لا تتغير */
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}
.fx>section{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
.fx>section:nth-child(2){animation-delay:.06s}.fx>section:nth-child(3){animation-delay:.12s}.fx>section:nth-child(4){animation-delay:.18s}.fx>section:nth-child(n+5){animation-delay:.24s}
.fx .split b,.fx .rank .bar b,.fx .mini b,.fx .loc .bar b{transform-origin:right;animation:grow .7s cubic-bezier(.2,.7,.2,1) .15s backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav id="nav" aria-label="الأقسام">
    <div class="brand"><b>EPTTS</b><span>لوحة الإدارة العليا</span></div>
    <div id="links"></div>
    <div class="navnote">التتبع على مستوى العلبة. المصدر: ملفات التصدير من الهيئة وداف.</div>
  </nav>
  <div id="login" hidden><form id="lf" autocomplete="on"><div id="llogos"></div><h1>EPTTS</h1><p>لوحة الإدارة العليا · تسجيل الدخول</p>
    <label>اسم المستخدم<input id="lu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" required></label>
    <label>كلمة المرور<input id="lp" name="password" type="password" autocomplete="current-password" dir="ltr" required></label>
    <button class="copybtn" type="submit" id="lb">دخول</button><div id="lerr" role="alert"></div></form></div>
  <div class="main">
    <header class="top">
      <div><h1 id="title"></h1><div class="sub" id="asof"></div></div>
      <div class="gsw" id="gsw"><input type="search" id="gs" placeholder="بحث سريع: شركة، منتج، GTIN، فاتورة، موزع…" aria-label="بحث عام" autocomplete="off"><div class="gsr" id="gsr" hidden></div></div>

<script>
(function(root){

function s(x){return x==null?'':String(x)}
function n0(x){if(x===''||x==null)return 0;var v=parseFloat(x);return isFinite(v)?Math.trunc(v):0}
function d10(x){return x?String(x).slice(0,10):''}
function cmp(a,b){return a<b?-1:a>b?1:0}

/* قراءة CSV بالمعيار (علامات اقتباس وأسطر داخل الحقول) */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  var rows=[],row=[],f='',q=false,i=0,n=text.length,c;
  while(i<n){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue}q=false;i++;continue}f+=c;i++;continue}
    if(c==='"'){q=true;i++;continue}
    if(c===','){row.push(f);f='';i++;continue}
    if(c==='\r'){i++;continue}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue}
    f+=c;i++}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  while(rows.length&&rows[rows.length-1].every(function(x){return x===''}))rows.pop();
  if(!rows.length)return [];
  var h=rows[0].map(function(x){return x.trim()}),out=[];
  for(var r=1;r<rows.length;r++){var o={},rw=rows[r];for(var k=0;k<h.length;k++)o[h[k]]=rw[k]===undefined?'':rw[k];out.push(o)}
  return out;

function xlDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){var ms=Date.UTC(1899,11,30)+Math.floor(v)*864e5;return new Date(ms).toISOString().slice(0,10)}
  if(v instanceof Date)return v.toISOString().slice(0,10);

/* تعرّف على نوع الملف من أسماء الأعمدة */
function detect(h){
  var has=function(k){return h.indexOf(k)>-1};
  if(has('Invoice #'))return 'invoices';
  if(has('Stock Qty'))return 'stock';
  if(has('previousPriceCents'))return 'hist';
  if(has('registrationEntityType'))return 'regs';
  if(has('metric')&&has('section'))return 'stats';
  if(has('registrantGln')&&has('registrationId'))return 'sp';
  if(has('mahGln')&&has('creationSource')&&has('gtin'))return 'prods';

}

function invoicesFromRows(rows){
  var hi=-1;for(var i=0;i<rows.length;i++){if(rows[i]&&rows[i][0]==='Invoice #'){hi=i;break}}
  if(hi<0)return [];var out=[];
  for(var j=hi+1;j<rows.length;j++){var r=rows[j];if(!r||!r[0]||String(r[0]).indexOf('INV')!==0)continue;
    out.push({no:s(r[0]),g:s(r[1]),n:s(r[2]),st:s(r[3]),at:xlDate(r[4]),paid:xlDate(r[5]),via:s(r[6]),u:n0(r[7]),sub:parseFloat(r[8])||0,vat:parseFloat(r[9])||0,fee:parseFloat(r[10])||0,tot:parseFloat(r[11])||0})}
  return out;
}
function invoicesFromCSV(objs){
  return objs.filter(function(r){return s(r['Invoice #']).indexOf('INV')===0}).map(function(r){return {no:r['Invoice #'],g:s(r['MAH GLN']),n:s(r['MAH Name']),st:s(r['Status']),at:d10(r['Created']),paid:d10(r['Paid']),via:s(r['Paid Via']),u:n0(r['Units']),sub:parseFloat(r['Subtotal'])||0,vat:parseFloat(r['VAT 14%'])||0,fee:parseFloat(r['eService Fee'])||0,tot:parseFloat(r['Total'])||0}});
}

function build(T,asof){

  var byg={},byid={};

  var ord={done:0,verified:1,draft:2};

  var branches=parties.filter(function(p){return p.type==='branch'});

      dist.push({n:s(p.name).trim(),a:s(p.nameAr).trim(),t:dtype(s(p.name),s(p.nameAr)),gov:GOV[p.governorateCode]||'',st:'registry',sites:ss[0],kinds:ss[1],q:ss[2],d:ss[3],p:ss[4],at:d10(p.createdAt)})}});

  var summ={},months={},mOrder=[];

    if(r.section==='month'){if(!months[r.period]){months[r.period]={};mOrder.push(r.period)}months[r.period][r.metric]=n0(r.count)}});

  return {invoices:invoices,asof:asof,companies:companies,dist:dist,products:products,disp:disp,sitelocs:sitelocs,summ:summ,monthly:monthly,
    reg_total:regs.length,mfr_sites:parties.filter(function(p){return p.type==='manufacturer'}).length,hist_n:hist.length,hist_src:hsrc};
}
